<text x="80" y="84" font-family="Arial,sans-serif" font-size="19" fill="#397579" font-weight="700">ЛИЧНЫЙ ПРОЕКТ  /  СХЕМА ПО ДОКУМЕНТАЦИИ</text>
<text x="80" y="186" font-family="Arial,sans-serif" font-size="61" fill="#243c45" font-weight="700">Сервисы на своём VPS</text>
<text x="80" y="251" font-family="Arial,sans-serif" font-size="27" fill="#506873" font-weight="400">Развёртывание и резервные копии. Иллюстрация устройства проекта,</text>
<text x="80" y="290" font-family="Arial,sans-serif" font-size="27" fill="#506873" font-weight="400">не скриншот работающего сервера.</text>
<text x="104" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Новый VPS</text>
<text x="104" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">SSH-ключи</text>
<text x="104" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Конструктор</text>
<text x="471" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Сервисы</text>
<text x="471" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">n8n · PostgreSQL</text>
<text x="471" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Docker · reverse proxy</text>
<text x="838" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Копии</text>
<text x="838" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Дампы и настройки</text>
<text x="838" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Локально · Nextcloud</text>
<text x="1205" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Проверка</text>
<text x="1205" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Свежесть и целостность</text>
<text x="1205" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Отчёт в Telegram</text>
<text x="108" y="717" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Личный вклад — замысел и workflows конструктора; скрипты — с ИИ-агентами.</text>
<text x="108" y="755" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Четыре VPS — со слов владельца в описанном опыте.</text>
<text x="80" y="919" font-family="Arial,sans-serif" font-size="19" fill="#657b80" font-weight="400">Портфолио  /  Основание: интервью, документы VPS-Ops. Схема не доказывает текущее состояние.</text>
