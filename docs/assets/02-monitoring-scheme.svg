<text x="80" y="84" font-family="Arial,sans-serif" font-size="19" fill="#397579" font-weight="700">ЛИЧНЫЙ ПРОЕКТ  /  СХЕМА ПО ДОКУМЕНТАЦИИ</text>
<text x="80" y="186" font-family="Arial,sans-serif" font-size="61" fill="#243c45" font-weight="700">Состояние сервера в Telegram</text>
<text x="80" y="251" font-family="Arial,sans-serif" font-size="27" fill="#506873" font-weight="400">От показателей — к диагностике. Архитектурная иллюстрация</text>
<text x="80" y="290" font-family="Arial,sans-serif" font-size="27" fill="#506873" font-weight="400">по документации, без вымышленных измерений и журналов.</text>
<text x="104" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Показатели</text>
<text x="104" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">CPU · память · диск</text>
<text x="104" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Контейнеры · uptime</text>
<text x="471" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Серверный бот</text>
<text x="471" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Команды состояния</text>
<text x="471" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Проверки и пороги</text>
<text x="838" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Telegram</text>
<text x="838" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Сводка и тревоги</text>
<text x="838" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Сигнал владельцу</text>
<text x="1205" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Диагностика</text>
<text x="1205" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Проверка причины</text>
<text x="1205" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Согласованное действие</text>
<text x="108" y="717" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Бот на контролируемом сервере не гарантирует сообщение при полном отказе VPS.</text>
<text x="108" y="755" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Telegram также может быть недоступен.</text>
<text x="108" y="793" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Внешний контроль доступности — отдельный контур.</text>
<text x="80" y="919" font-family="Arial,sans-serif" font-size="19" fill="#657b80" font-weight="400">Портфолио  /  Основание: VPS-Ops, server-monitoring.md. Живые показатели не снимались.</text>
