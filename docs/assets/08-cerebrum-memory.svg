<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Cerebrum: знания, поиск и проверяемый ответ</title><desc id="desc">Обезличенная схема. Заметки, решения и документы поступают в память PostgreSQL. Поиск объединяет точность, смысл, граф, время и структуру. Ответ возвращается с источниками и возможностью уточнения.</desc>
<rect width="1280" height="720" rx="28" fill="#15234c"/>
