<text x="1160" y="432" fill="#ffffff" font-size="20" text-anchor="middle">Ответ</text>
<rect x="728" y="510" width="380" height="58" rx="14" fill="#ffdcce"/><text x="918" y="547" fill="#5a3028" font-size="22" text-anchor="middle">Уточнить · исправить · подтвердить</text>
<text x="72" y="640" fill="#ffffff" font-size="23">n8n связывает этапы. Telegram — интерфейс человека.</text><text x="72" y="681" fill="#b5c7eb" font-size="18">Схема по документации. Личных данных и живого подключения нет.</text>
</g></svg>
