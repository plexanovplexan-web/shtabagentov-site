<g font-family="Segoe UI,Arial,sans-serif"><text x="72" y="87" fill="#ffffff" font-size="42" font-weight="700">Cerebrum</text><text x="72" y="128" fill="#c4d3f4" font-size="24">Память с контекстом. Ответ с источником.</text>
<g fill="#26385e" stroke="#7187b3" stroke-width="1.5"><rect x="72" y="207" width="198" height="76" rx="16"/><rect x="72" y="317" width="198" height="76" rx="16"/><rect x="72" y="427" width="198" height="76" rx="16"/></g>
<g fill="#ffffff" font-size="25" text-anchor="middle"><text x="171" y="255">Заметки</text><text x="171" y="365">Решения</text><text x="171" y="475">Документы</text></g>
<rect x="480" y="273" width="280" height="157" rx="24" fill="#b4f2ed"/><text x="620" y="330" fill="#15234c" font-size="30" font-weight="700" text-anchor="middle">Своя память</text><text x="620" y="371" fill="#274d61" font-size="22" text-anchor="middle">PostgreSQL + pgvector</text><text x="620" y="405" fill="#274d61" font-size="20" text-anchor="middle">Источники · версии · связи</text>
<rect x="850" y="222" width="230" height="250" rx="23" fill="#4261ef"/><text x="965" y="270" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">Поиск</text><g fill="#ffffff" font-size="22"><text x="878" y="312">Точное совпадение</text><text x="878" y="347">Смысл и связи</text><text x="878" y="382">Время</text><text x="878" y="417">Структура</text></g>
