<text x="80" y="84" font-family="Arial,sans-serif" font-size="19" fill="#397579" font-weight="700">ЛИЧНЫЙ ПРОЕКТ  /  СХЕМА ПО ДОКУМЕНТАЦИИ</text>
<text x="80" y="186" font-family="Arial,sans-serif" font-size="61" fill="#243c45" font-weight="700">Jarvis: диспетчер ИИ-агентов</text>
<text x="80" y="251" font-family="Arial,sans-serif" font-size="27" fill="#506873" font-weight="400">Принятый прототип Ф1.3: задачи, подтверждения и остановка.</text>
<text x="80" y="290" font-family="Arial,sans-serif" font-size="27" fill="#506873" font-weight="400">Техническая иллюстрация по исходникам и актам, не скриншот приложения.</text>
<text x="104" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Оболочка</text>
<text x="104" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Tauri · React</text>
<text x="104" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">TypeScript · Windows</text>
<text x="471" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Локальное ядро</text>
<text x="471" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Python · FastAPI</text>
<text x="471" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">SQLite · история</text>
<text x="838" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">Подтверждения</text>
<text x="838" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Одно решение</text>
<text x="838" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">на конкретный вызов</text>
<text x="1205" y="435" font-family="Arial,sans-serif" font-size="30" fill="#243c45" font-weight="700">СТОП</text>
<text x="1205" y="494" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Отзыв разрешений</text>
<text x="1205" y="530" font-family="Arial,sans-serif" font-size="24" fill="#506873" font-weight="400">Остановка процессов</text>
<text x="108" y="717" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Ф1.3 принята по актам; операции ограничены тестовым контуром.</text>
<text x="108" y="755" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Голосовой этап Ф2 развивается отдельно и целиком ещё не принят.</text>
<text x="108" y="793" font-family="Arial,sans-serif" font-size="26" fill="#243c45" font-weight="400">Подготовка портфолио не включала новых запусков приложения и тестов.</text>
<text x="80" y="919" font-family="Arial,sans-serif" font-size="19" fill="#657b80" font-weight="400">Портфолио  /  Личный проект, реализация с ИИ-агентами. Полная изоляция Windows не заявляется.</text>
